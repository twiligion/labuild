# default.conf — abuild / labuild default configuration (apk v3)
APK_COMPRESSION="zstd"
APK_INDEX_FILE="Packages.adb"
DOC_COMPRESSION="zstd"

CARCH="$(uname -m)"
case "$CARCH" in
	x86_64) CARCH="x86_64" ;;
	aarch64) CARCH="aarch64" ;;
	armv7l) CARCH="armv7" ;;
	armv6l) CARCH="armhf" ;;
	i686) CARCH="x86" ;;
	s390x) CARCH="s390x" ;;
	ppc64le) CARCH="ppc64le" ;;
	riscv64) CARCH="riscv64" ;;
esac
CHOST="$CARCH-alpine-linux-musl"
PACKAGER="abuild <abuild@alpinelinux.org>"
REPODEST="$PWD/packages"
SRCDEST="$PWD"
BUILDDIR="$PWD/src"
PKGDEST="$PWD/pkg"
